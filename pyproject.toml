[tool.poetry]
name = "terranote-core"
version = "0.1.0"
description = "Central module for orchestrating Terranote note creation workflows."
authors = ["Terranote Contributors <no-reply@terranote.org>"]
license = "GPL-3.0-or-later"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
httpx = "^0.27.2"
pydantic-settings = "^2.3.3"
redis = "^5.0.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.8"
anyio = "^4.4.0"
httpx = { version = "^0.27.2", extras = ["http2"] }
ruff = "^0.6.3"
black = "^24.8.0"
mypy = "^1.11.1"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


