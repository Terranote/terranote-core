services:
  terranote-core:
    build:
      context: ..
      dockerfile: ../Dockerfile
    container_name: terranote-core
    environment:
      - LOGLEVEL=info
    ports:
      - "8000:8000"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: terranote-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

